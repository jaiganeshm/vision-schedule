<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISION Weekly Schedule — SKY North America</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    SKY North America · Adults Transformation Track &nbsp;·&nbsp;
    <a href="https://skyna.org" target="_blank" rel="noopener">skyna.org</a>
  </div>

  <!-- NAV -->
  <nav>
    <div class="nav-brand">VISION <span>Program</span></div>
    <div class="nav-sub">Weekly Class Schedule</div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <p class="hero-eyebrow">SKY North America · Adults Learning</p>
    <h1>This Week's <em>Schedule</em></h1>
    <div class="hero-week" id="week-label">Loading…</div>
  </section>

  <!-- YEAR TABS -->
  <div class="tabs-wrap">
    <button class="tab-btn active" data-year="all">All Years</button>
    <button class="tab-btn" data-year="1">Year 1</button>
    <button class="tab-btn" data-year="2">Year 2</button>
  </div>

  <!-- LEGEND -->
  <div class="legend">
    <span class="legend-item"><span class="badge badge-y1">Year 1</span></span>
    <span class="legend-item"><span class="badge badge-y2">Year 2</span></span>
    <span class="legend-item"><span class="badge badge-both">Both Years</span></span>
    <span class="legend-item" style="color: #999; font-size:0.78rem;">All times PDT</span>
  </div>

  <!-- SCHEDULE -->
  <section class="schedule-section">
    <div id="sat-container"></div>
    <div id="sun-container"></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-brand">SKY <span>North America</span></div>
    <p>Adults Transformation Track · VISION Program</p>
    <p>Vazhga Valamudan 🙏</p>
  </footer>

  <script src="js/schedule.js"></script>
</body>
</html>
